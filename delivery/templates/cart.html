<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Foodie Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            color: #ff5722 !important;
        }
        .cart-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .quantity-btn:hover {
            background: #f8f9fa;
        }
        .summary-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px;
        }
        .btn-checkout {
            background: #ff5722;
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
        }
        .btn-checkout:hover {
            background: #e64a19;
            color: white;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-cart i {
            font-size: 80px;
            color: #ddd;
            margin-bottom: 20px;
        }
        .nav-link {
            font-weight: 500;
            color: #333 !important;
        }
        .nav-link:hover {
            color: #ff5722 !important;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fs-3" href="/">Foodie</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-3">
                <li class="nav-item">
                    <a class="nav-link" href="/restaurants/">Restaurants</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart/">Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/user-orders/">My Orders</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login/">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="fw-bold mb-4">Your Cart</h1>
    
    <div class="row">
        <div class="col-lg-8">
            <div class="cart-container" id="cartContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="summary-card" id="summaryCard">
                <h4 class="fw-bold mb-4">Order Summary</h4>
                <div class="d-flex justify-content-between mb-3">
                    <span>Subtotal</span>
                    <span class="fw-bold" id="subtotal">$0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Delivery Fee</span>
                    <span class="fw-bold">$2.99</span>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold text-primary" id="total">$0.00</span>
                </div>
                <button class="btn btn-checkout" onclick="proceedToCheckout()" id="checkoutBtn" disabled>
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center py-4 bg-white shadow-sm mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2025 Foodie Delivery | All Rights Reserved</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function loadCart() {
    try {
        const response = await fetch('/orders/cart/');
        if (response.ok) {
            const cart = await response.json();
            displayCart(cart);
        } else {
            // User not logged in
            displayEmptyCart();
        }
    } catch (error) {
        console.error('Error loading cart:', error);
        displayEmptyCart();
    }
}

function displayCart(cart) {
    const container = document.getElementById('cartContainer');
    
    if (!cart.items || cart.items.length === 0) {
        displayEmptyCart();
        return;
    }
    
    let html = '';
    cart.items.forEach(item => {
        html += `
            <div class="cart-item">
                <div class="row align-items-center">
                    <div class="col-md-2">
                        <img src="${item.menu_item.image || 'https://via.placeholder.com/80'}" 
                             class="item-image" alt="${item.menu_item.name}">
                    </div>
                    <div class="col-md-4">
                        <h5 class="fw-bold mb-1">${item.menu_item.name}</h5>
                        <p class="text-muted small mb-0">${item.menu_item.description || 'Delicious item'}</p>
                        <p class="fw-bold text-primary mb-0">$${item.menu_item.price.toFixed(2)}</p>
                    </div>
                    <div class="col-md-3">
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div class="col-md-2 text-end">
                        <h5 class="fw-bold mb-0">$${item.subtotal.toFixed(2)}</h5>
                        <button class="btn btn-link text-danger p-0" onclick="removeItem(${item.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
    updateSummary(cart);
}

function displayEmptyCart() {
    const container = document.getElementById('cartContainer');
    container.innerHTML = `
        <div class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h3>Your cart is empty</h3>
            <p class="text-muted">Add some delicious items to get started!</p>
            <a href="/restaurants/" class="btn btn-primary-custom mt-3">Browse Restaurants</a>
        </div>
    `;
    
    document.getElementById('subtotal').textContent = '$0.00';
    document.getElementById('total').textContent = '$0.00';
    document.getElementById('checkoutBtn').disabled = true;
}

function updateSummary(cart) {
    const subtotal = cart.total || 0;
    const deliveryFee = 2.99;
    const total = subtotal + deliveryFee;
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    document.getElementById('checkoutBtn').disabled = false;
}

async function updateQuantity(itemId, newQuantity) {
    if (newQuantity <= 0) {
        removeItem(itemId);
        return;
    }
    
    try {
        const response = await fetch(`/orders/cart/update-item/${itemId}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
            },
            body: JSON.stringify({ quantity: newQuantity })
        });
        
        if (response.ok) {
            const cart = await response.json();
            displayCart(cart);
        }
    } catch (error) {
        console.error('Error updating quantity:', error);
    }
}

async function removeItem(itemId) {
    try {
        const response = await fetch(`/orders/cart/remove-item/${itemId}/`, {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': getCSRFToken()
            }
        });
        
        if (response.ok) {
            const cart = await response.json();
            displayCart(cart);
        }
    } catch (error) {
        console.error('Error removing item:', error);
    }
}

async function clearCart() {
    try {
        const response = await fetch('/orders/cart/clear/', {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': getCSRFToken()
            }
        });
        
        if (response.ok) {
            const cart = await response.json();
            displayCart(cart);
        }
    } catch (error) {
        console.error('Error clearing cart:', error);
    }
}

function proceedToCheckout() {
    // For now, just alert - in a real app, this would go to checkout page
    alert('Checkout functionality would be implemented here. For now, please use the API to create orders.');
}

function getCSRFToken() {
    const name = 'csrftoken';
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Load cart on page load
document.addEventListener('DOMContentLoaded', loadCart);
</script>
</body>
</html>
