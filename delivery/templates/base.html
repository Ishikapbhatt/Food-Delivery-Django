<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Food Delivery{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f8f9fa; font-family: 'Poppins', sans-serif; }
        .btn-primary-custom {
            background: #ff5722; border: none; padding: 12px 28px;
            border-radius: 50px; font-weight: 600; transition: .3s;
        }
        .btn-primary-custom:hover { background: #e64a19; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fs-3 fw-bold" href="/">Foodie</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="menu" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto gap-4">
                <li><a class="nav-link" href="/">Home</a></li>
                <li><a class="nav-link" href="/restaurants/">Restaurants</a></li>
                <li><a class="nav-link" href="/cart/">Cart</a></li>
                <li><a class="nav-link" href="/user-orders/">My Orders</a></li>
                <li><a class="nav-link" href="/login/">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="text-center mt-5 py-3 bg-white shadow-sm">
    <p class="mb-0">&copy; 2025 Foodie Delivery</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
